name: simulated-annealing

on:
  push:
    paths: ['simulated-annealing/**', '.github/workflows/simulated-annealing.yml']
  pull_request:
    paths: ['simulated-annealing/**', '.github/workflows/simulated-annealing.yml']

defaults:
  run:
    working-directory: simulated-annealing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Run
        run: timeout 120 ./main | tail -n 20
