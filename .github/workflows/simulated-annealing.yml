name: simulated-annealing

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: simulated-annealing

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
