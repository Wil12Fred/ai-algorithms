name: tsp-genetic-glut

on:
  push:
    paths: ['tsp-genetic-glut/**', '.github/workflows/tsp-genetic-glut.yml']
  pull_request:
    paths: ['tsp-genetic-glut/**', '.github/workflows/tsp-genetic-glut.yml']

defaults:
  run:
    working-directory: tsp-genetic-glut

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL/GLUT headers
        run: sudo apt-get update && sudo apt-get install -y freeglut3-dev
      - name: Build
        run: make
