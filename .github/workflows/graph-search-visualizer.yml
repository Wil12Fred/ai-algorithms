name: graph-search-visualizer

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: graph-search-visualizer

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL/GLUT, Xvfb and xdotool
        run: sudo apt-get update && sudo apt-get install -y freeglut3-dev xvfb xdotool
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Headless smoke run
        run: make smoke
